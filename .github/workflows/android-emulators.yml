name: Android Emulators

on: [push, pull_request]

jobs:
  android-emulator-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        android-version: [
        #   {api: 21, name: "5", java: "8"},
        #   {api: 24, name: "7", java: "8"},
          {api: 27, name: "8.", java: "8"},
          {api: 28, name: "9", java: "8"},
          {api: 30, name: "11", java: "11"},
          {api: 31, name: "12", java: "11"},
          {api: 33, name: "13", java: "17"}
        ]
      fail-fast: false

    name: android-emulator-test (version:${{ matrix.android-version.name }},api:${{ matrix.android-version.api }},java:${{ matrix.android-version.java }})

    steps:
      - name: Setup Linux kernel for hardware acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -y cpu-checker bridge-utils qemu-kvm libvirt-daemon-system libvirt-clients
          sudo adduser $USER kvm
          sudo chown $USER /dev/kvm
          sudo chmod 777 /dev/kvm
          

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          kvm-ok

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.android-version.java }}
          distribution: 'temurin'

      - name: Install Android SDK
        timeout-minutes: 10
        env:
          ANDROID_SDK_ROOT: ${{ github.workspace }}/android-sdk
        run: |
          sudo apt-get install -y wget unzip
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_SDK_ROOT/cmdline-tools
          mv $ANDROID_SDK_ROOT/cmdline-tools/cmdline-tools $ANDROID_SDK_ROOT/cmdline-tools/latest
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_SDK_ROOT/emulator" >> $GITHUB_PATH

      - name: Accept licenses and install SDK packages
        timeout-minutes: 10
        run: |
          yes | sdkmanager --licenses
          sdkmanager --update
          sdkmanager --list
          sdkmanager \
            "platform-tools" \
            "platforms;android-${{ matrix.android-version.api }}" \
            "system-images;android-${{ matrix.android-version.api }};google_apis;x86_64" \
            "emulator"

      - name: Verify SDK installation
        run: |
          sdkmanager --list

      - name: Create and start emulator
        timeout-minutes: 10
        run: |
          echo "no" | avdmanager create avd \
            -n test \
            -k "system-images;android-${{ matrix.android-version.api }};google_apis;x86_64"
          
          # Verify KVM is available
          ls -la /dev/kvm
          
          # Start emulator with hardware acceleration
          $ANDROID_SDK_ROOT/emulator/emulator \
            -avd test \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel on \
            -memory 4096 \
            -qemu -enable-kvm &

      - name: Wait for emulator to start
        timeout-minutes: 10
        run: |
          # Wait for emulator to start
          echo "Waiting for emulator to start..."
          adb wait-for-device
          while [[ "$(adb shell getprop sys.boot_completed 2>&1)" != "1" ]]; do 
              echo "Emulator not booted yet..."
              sleep 30
          done
          
          #   while [[ "$(adb shell getprop init.svc.bootanim 2>&1)" != "stopped" ]]; do 
            echo "Boot animation still running..."
            sleep 30
          done
          
          # Wait for system to complete boot
          echo "Waiting for system boot completion..."
          while [[ "$(adb shell getprop sys.boot_completed 2>&1)" != "1" ]]; do 
            echo "System boot not completed yet..."
            sleep 30
          done
          
          echo "Verifying device status..."
          adb shell getprop sys.boot_completed
          adb shell input keyevent 82
          echo "Emulator is ready"

      - name: Check emulator status
        if: always()
        run: |
          adb devices
          adb shell getprop sys.boot_completed

      - name: Capture emulator screenshot
        if: always()
        run: |
          timestamp=$(date +%Y%m%d%H%M%S)
          adb exec-out screencap -p > emulator-screenshot-${{ matrix.android-version.api }}-${timestamp}.png
      
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot-android-${{ matrix.android-version.api }}
          path: emulator-screenshot-${{ matrix.android-version.api }}-*.png
  