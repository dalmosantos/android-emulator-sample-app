name: Android Emulators

on: [push, pull_request]

jobs:
  android-emulator-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      ANDROID_HOME: ${{ github.workspace }}/android-sdk
      TZ: America/Sao_Paulo
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ARTIFACTS_BASE_PATH: artifacts/${{ matrix.android-version.api }}
      
    strategy:
      matrix:
        android-version: [
          {api: 24, name: "7", java: "17"},
          {api: 26, name: "8", java: "17"},
          {api: 28, name: "9", java: "17"},
          {api: 29, name: "10", java: "17"},
          {api: 30, name: "11", java: "17"},
          {api: 31, name: "12", java: "17"},
          {api: 33, name: "13", java: "17"},
          {api: 34, name: "14", java: "17"}
        ]
      fail-fast: false

    name: android-emulator-test {version:${{ matrix.android-version.name }},api:${{ matrix.android-version.api }},java:${{ matrix.android-version.java }}}

    steps:
      - name: Clean workspace before build
        run: |
          echo "Cleaning workspace before build..."
          sudo rm -rf ${{ github.workspace }}/*

      - name: Checkout code
        uses: actions/checkout@v3

      - name: Validate Gradle wrapper
        uses: gradle/wrapper-validation-action@v1

      - name: Setup Linux kernel for hardware acceleration
        run: |
          sudo apt-get update
          sudo apt-get install -qqy cpu-checker bridge-utils qemu-kvm libvirt-daemon-system libvirt-clients libnss3 wget unzip
          sudo adduser $USER kvm
          sudo chown $USER /dev/kvm
          sudo chmod 777 /dev/kvm

      - name: Enable KVM group perms
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          kvm-ok

      - name: Set up JDK
        uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.android-version.java }}
          distribution: 'temurin'

      - name: Setup Gradle Cache
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.android
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Set JAVA_HOME and javac
        run: |
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_ENV
          echo "javac=$(which javac)" >> $GITHUB_ENV
          echo "JAVA_HOME=$(dirname $(dirname $(readlink -f $(which java))))" >> $GITHUB_PATH
          echo "javac=$(which javac)" >> $GITHUB_PATH
          echo "====================================================================="
          echo "               JAVA_HOME is set to: $JAVA_HOME"
          echo "               JAVAC is set to: $(which javac)"
          echo "====================================================================="
         

      - name: Install Android SDK
        timeout-minutes: 15
        run: |
          mkdir -p $ANDROID_HOME/cmdline-tools
          wget https://dl.google.com/android/repository/commandlinetools-linux-7583922_latest.zip -O cmdline-tools.zip
          unzip cmdline-tools.zip -d $ANDROID_HOME/cmdline-tools
          mv $ANDROID_HOME/cmdline-tools/cmdline-tools $ANDROID_HOME/cmdline-tools/latest
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
          echo "$ANDROID_HOME/emulator" >> $GITHUB_PATH

      - name: Accept licenses and install SDK packages
        timeout-minutes: 15
        run: |
          yes | sdkmanager --licenses
          sdkmanager \
            "platform-tools" \
            "platforms;android-${{ matrix.android-version.api }}" \
            "system-images;android-${{ matrix.android-version.api }};google_apis;x86_64" \
            "emulator"

      - name: Build the project
        run: |
          unset ANDROID_SDK_ROOT
          ./gradlew build --no-daemon

      - name: Create and start emulator
        timeout-minutes: 15
        run: |
          echo "no" | avdmanager create avd \
            -n test \
            -k "system-images;android-${{ matrix.android-version.api }};google_apis;x86_64" \
            --force
          
          export ANDROID_EMULATOR_USE_SYSTEM_LIBS=1
          $ANDROID_HOME/emulator/emulator -version
          $ANDROID_HOME/emulator/emulator -list-avds

          # Determine memory size based on Android version
          if [ "${{ matrix.android-version.api }}" -eq 24 ]; then
            MEMORY_SIZE=3072
          else
            MEMORY_SIZE=4096
          fi

          # Start emulator with hardware acceleration
          $ANDROID_HOME/emulator/emulator \
            -avd test \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -gpu swiftshader_indirect \
            -accel auto \
            -memory ${MEMORY_SIZE} \
            -selinux permissive \
            -qemu -enable-kvm &
  
      - name: Wait for emulator to start
        timeout-minutes: 10
        run: |
          MAX_ATTEMPTS=10
          SLEEP_INTERVAL=15  # Reduced from 30 to 15 seconds
           
          # Function to check boot status
          check_boot_status() {
              adb shell getprop sys.boot_completed 2>/dev/null || echo "0"
          }
      
          # Wait for emulator with optimized polling
          for ((attempt=1; attempt <= MAX_ATTEMPTS; attempt++)); do
              if [ "$(check_boot_status)" == "1" ]; then
                  echo "Emulator is ready!"
                  break
              fi
                  
              echo "Waiting for emulator to start... Attempt $attempt of $MAX_ATTEMPTS"
              sleep $SLEEP_INTERVAL
          done
      
          # Exit if boot not completed
          if [ "$(check_boot_status)" != "1" ]; then
              echo "Emulator failed to start within the timeout!"
                  exit 1
              fi
      
          # Device status verification in parallel
          {
              ANDROID_VERSION=$(adb shell getprop ro.build.version.release)
              echo "Android: $ANDROID_VERSION"
          } &
      
          {
              echo "Unlocking screen..."
              adb shell input keyevent 82
          } &
      
          # Wait for background tasks to complete
          wait
          echo "Verifying final device status..."
          adb shell getprop sys.boot_completed
          echo "Emulator is ready"
          
      # Install and Setup
      - name: Upload APK to emulator
        run: |
          adb install app/build/outputs/apk/debug/app-debug.apk

      - name: Set timestamp and ARTIFACTS_BASE_PATH
        if: always()
        run: |
          timestamp=$(date +%Y%m%d%H%M)
          echo "timestamp=${timestamp}" >> $GITHUB_ENV
          echo "ARTIFACTS_BASE_PATH=artifacts/${{ matrix.android-version.api }}-${timestamp}" >> $GITHUB_ENV

      # Test Execution
      - name: Run tests
        run: |
          unset ANDROID_SDK_ROOT
          ./gradlew connectedAndroidTest --no-daemon --parallel

      # # Open the app
      # - name: Open the app
      #   run: |
      #     adb shell monkey -p com.example.android.testing.espresso.BasicSample -c android.intent.category.LAUNCHER 1

      # Artifact Collection
      - name: Capture emulator screenshot
        if: always()
        run: |
          mkdir -p ${{ env.ARTIFACTS_BASE_PATH }}/screenshots
          adb exec-out screencap -p > ${{ env.ARTIFACTS_BASE_PATH }}/screenshots/emulator-screenshot-${{ matrix.android-version.api }}-${{ env.timestamp }}.png
        
      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: emulator-screenshot-android-${{ matrix.android-version.api }}
          path: ${{ env.ARTIFACTS_BASE_PATH }}/screenshots/*.png
        
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-api-${{ matrix.android-version.api }}
          path: |
            ${{ env.ARTIFACTS_BASE_PATH }}/results/**/build/reports/
            ${{ env.ARTIFACTS_BASE_PATH }}/results/**/build/outputs/androidTest-results/
          retention-days: 1

      - name: Clean up and stop emulator
        if: always()
        run: |
          adb emu kill || echo "Emulator already stopped"
          sudo apt-get clean
          rm -rf $ANDROID_HOME
          echo "Cleaning workspace after build..."
          sudo rm -rf ${{ github.workspace }}/*
